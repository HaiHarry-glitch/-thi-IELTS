[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"

[functions]
  included_files = [
    "../data/normalized/**",
    "../data/normalized-listening/**",
    "../data/index/**",
    "../data/full-tests/**",
    "../data/sessions/storage-state.json",
    "../data/api/vocab/**"
  ]
